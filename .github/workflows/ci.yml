name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Restrict permissions for security
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest black isort flake8 mypy
    
    - name: Run black (code formatting check)
      run: |
        black --check --diff src/ tests/
      continue-on-error: false
    
    - name: Run isort (import sorting check)
      run: |
        isort --check-only --diff src/ tests/
      continue-on-error: false
    
    - name: Run flake8 (linting)
      run: |
        flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503
      continue-on-error: false
    
    - name: Run mypy (type checking)
      run: |
        mypy src/ --ignore-missing-imports
      continue-on-error: true
    
    - name: Run pytest (tests)
      run: |
        pytest tests/ -v --tb=short
      env:
        GOOGLE_API_KEY: dummy_key_for_testing
    
    - name: Test import structure
      run: |
        python -c "from src.core import DebateOrchestrator, LegalArgument; print('✓ Imports successful')"
        python -c "from src.utils import MockLLM; print('✓ MockLLM import successful')"
      env:
        GOOGLE_API_KEY: dummy_key_for_testing
